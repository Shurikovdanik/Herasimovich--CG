<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ЛР3 — Базовые растровые алгоритмы</title>
<style>
  :root { --bg:#f5f7fa; --panel:#fff; --line:#d0d7de; --accent:#1e88e5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:var(--bg); color:#222; }
  h1 { font-size:20px; margin:12px 16px; }
  .app { display:grid; grid-template-columns: 320px 1fr; gap:12px; padding:0 16px 16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .controls label { display:block; margin:6px 0; font-size:13px; }
  .controls input[type=number], .controls select { width:100%; padding:4px 6px; margin-top:2px; }
  .row { display:flex; gap:8px; }
  .row > label { flex:1; }
  .buttons { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  button { padding:6px 10px; border:1px solid #1976d2; border-radius:6px; background:#1e88e5; color:#fff; cursor:pointer; font-size:13px; }
  button.secondary { background:#fff; color:#1976d2; }
  button:active { transform:translateY(1px); }
  .canvas-wrap { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:auto; }
  canvas { display:block; }
  .info { font-size:13px; line-height:1.4; margin:8px 0; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { border:1px solid var(--line); padding:3px 5px; text-align:right; }
  th { background:#f0f4f8; }
  tr.current { background:#ffebee; font-weight:bold; }
  .hint { font-size:12px; color:#555; }
  .right { display:flex; flex-direction:column; gap:12px; }
  @media (max-width: 900px) { .app { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>Лабораторная работа 3. Базовые растровые алгоритмы</h1>
<div class="app">
  <div class="panel controls">
    <label>Алгоритм
      <select id="algo">
        <option value="step">Пошаговый алгоритм</option>
        <option value="dda">ЦДА (DDA)</option>
        <option value="bresLine" selected>Брезенхем — отрезок</option>
        <option value="bresCircle">Брезенхем — окружность</option>
      </select>
    </label>
    <div class="row">
      <label>x1 / центр x<input id="x1" type="number" value="2" step="1"></label>
      <label>y1 / центр y<input id="y1" type="number" value="3" step="1"></label>
    </div>
    <div class="row">
      <label>x2<input id="x2" type="number" value="11" step="1"></label>
      <label>y2<input id="y2" type="number" value="7" step="1"></label>
    </div>
    <label>Радиус (для окружности)<input id="radius" type="number" value="5" min="0" step="1"></label>
    <label>Масштаб: <span id="scaleLabel">40</span> px / ед.
      <input id="scale" type="range" min="10" max="80" value="40" step="1">
    </label>
    <label><input id="showGrid" type="checkbox" checked> показывать сетку</label>
    <div class="buttons">
      <button id="btnDraw">Построить</button>
      <button id="btnAnimate" class="secondary">Анимация</button>
      <button id="btnTiming" class="secondary">Замер времени</button>
      <button id="btnClear" class="secondary">Очистить</button>
    </div>
    <p class="hint">Для окружности используются x1, y1 как центр и поле «Радиус». Для отрезков — x1,y1 и x2,y2.</p>
  </div>

  <div class="right">
    <div class="canvas-wrap">
      <canvas id="canvas" width="900" height="600"></canvas>
    </div>
    <div class="panel">
      <div id="info" class="info">Выберите алгоритм и нажмите «Построить».</div>
      <div id="stepsWrap"></div>
    </div>
  </div>
</div>

<script>
    //Here JS (I hate this)
(function(){
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const els = {
    algo: document.getElementById('algo'),
    x1: document.getElementById('x1'),
    y1: document.getElementById('y1'),
    x2: document.getElementById('x2'),
    y2: document.getElementById('y2'),
    radius: document.getElementById('radius'),
    scale: document.getElementById('scale'),
    scaleLabel: document.getElementById('scaleLabel'),
    showGrid: document.getElementById('showGrid'),
    info: document.getElementById('info'),
    stepsWrap: document.getElementById('stepsWrap')
  };

  let state = {
    points: [],
    scale: 40,
    showGrid: true,
    timer: null,
    animIndex: -1,
    lastParams: null
  };

  function readParams() {
    const x1 = parseInt(els.x1.value, 10) || 0;
    const y1 = parseInt(els.y1.value, 10) || 0;
    const x2 = parseInt(els.x2.value, 10) || 0;
    const y2 = parseInt(els.y2.value, 10) || 0;
    const r = Math.max(0, parseInt(els.radius.value, 10) || 0);
    const algo = els.algo.value;
    state.scale = parseInt(els.scale.value, 10) || 40;
    state.showGrid = els.showGrid.checked;
    els.scaleLabel.textContent = String(state.scale);
    return { x1, y1, x2, y2, r, algo };
  }

  function worldToScreen(x, y) {
    return {
      sx: W / 2 + x * state.scale,
      sy: H / 2 - y * state.scale
    };
  }

  function drawGrid() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const s = state.scale;
    const ox = W / 2;
    const oy = H / 2;

    if (state.showGrid) {
      const minX = Math.ceil(-ox / s);
      const maxX = Math.floor((W - ox) / s);
      const minY = Math.ceil((oy - H) / s);
      const maxY = Math.floor(oy / s);

      ctx.strokeStyle = '#e6e6e6';
      ctx.lineWidth = 1;
      for (let x = minX; x <= maxX; x++) {
        const sx = ox + x * s;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, H);
        ctx.stroke();
      }
      for (let y = minY; y <= maxY; y++) {
        const sy = oy - y * s;
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(W, sy);
        ctx.stroke();
      }

      const labelStep = s >= 35 ? 1 : (s >= 20 ? 2 : 5);
      ctx.fillStyle = '#666';
      ctx.font = '11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (let x = minX; x <= maxX; x++) {
        if (x !== 0 && x % labelStep === 0) {
          const sx = ox + x * s;
          ctx.fillText(String(x), sx, oy + 3);
        }
      }
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let y = minY; y <= maxY; y++) {
        if (y !== 0 && y % labelStep === 0) {
          const sy = oy - y * s;
          ctx.fillText(String(y), ox - 4, sy);
        }
      }
    }

    // Оси
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, oy);
    ctx.lineTo(W, oy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ox, 0);
    ctx.lineTo(ox, H);
    ctx.stroke();

    ctx.fillStyle = '#000000';
    ctx.font = '12px Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('0', ox + 4, oy + 4);
  }

  function drawPixel(x, y, color, factor) {
    const p = worldToScreen(x, y);
    const s = state.scale * (factor || 1);
    ctx.fillStyle = color;
    ctx.fillRect(p.sx - s / 2, p.sy - s / 2, s, s);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.sx - s / 2, p.sy - s / 2, s, s);
  }

  function drawPoints(points, upto, highlight) {
    const last = (upto === undefined || upto === null) ? points.length - 1 : upto;
    for (let i = 0; i <= last && i < points.length; i++) {
      drawPixel(points[i].x, points[i].y, '#1e88e5', 1);
    }
    if (highlight !== undefined && highlight !== null && highlight >= 0 && highlight < points.length) {
      drawPixel(points[highlight].x, points[highlight].y, '#e53935', 1.15);
    }
  }

  function render(points, upto, highlight) {
    drawGrid();
    drawPoints(points || [], upto, highlight);
  }

  // ----- Алгоритмы -----

  function stepLine(x1, y1, x2, y2) {
    const pts = [];
    const dx = x2 - x1;
    const dy = y2 - y1;
    if (dx === 0 && dy === 0) return [{ x: x1, y: y1 }];

    if (Math.abs(dx) >= Math.abs(dy)) {
      const sx = dx >= 0 ? 1 : -1;
      for (let x = x1; ; x += sx) {
        const y = Math.round(y1 + (dy / dx) * (x - x1));
        pts.push({ x: x, y: y });
        if (x === x2) break;
      }
    } else {
      const sy = dy >= 0 ? 1 : -1;
      for (let y = y1; ; y += sy) {
        const x = Math.round(x1 + (dx / dy) * (y - y1));
        pts.push({ x: x, y: y });
        if (y === y2) break;
      }
    }
    return pts;
  }

  function ddaLine(x1, y1, x2, y2) {
    const pts = [];
    const dx = x2 - x1;
    const dy = y2 - y1;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    if (steps === 0) return [{ x: x1, y: y1 }];

    const xInc = dx / steps;
    const yInc = dy / steps;
    let x = x1;
    let y = y1;
    for (let i = 0; i <= steps; i++) {
      pts.push({ x: Math.round(x), y: Math.round(y) });
      x += xInc;
      y += yInc;
    }
    return pts;
  }

  function bresenhamLine(x1, y1, x2, y2) {
    const pts = [];
    let x = x1;
    let y = y1;
    const dx = Math.abs(x2 - x1);
    const dy = -Math.abs(y2 - y1);
    const sx = x1 < x2 ? 1 : -1;
    const sy = y1 < y2 ? 1 : -1;
    let err = dx + dy;

    while (true) {
      pts.push({ x: x, y: y });
      if (x === x2 && y === y2) break;
      const e2 = 2 * err;
      if (e2 >= dy) {
        err += dy;
        x += sx;
      }
      if (e2 <= dx) {
        err += dx;
        y += sy;
      }
    }
    return pts;
  }

  function uniquePoints(points) {
    const seen = new Set();
    const out = [];
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const key = p.x + ',' + p.y;
      if (!seen.has(key)) {
        seen.add(key);
        out.push(p);
      }
    }
    return out;
  }

  function bresenhamCircle(cx, cy, r) {
    const pts = [];
    if (r < 0) return pts;

    let x = 0;
    let y = r;
    let d = 3 - 2 * r;

    function add8(px, py) {
      pts.push({ x: cx + px, y: cy + py });
      pts.push({ x: cx + py, y: cy + px });
      pts.push({ x: cx + py, y: cy - px });
      pts.push({ x: cx + px, y: cy - py });
      pts.push({ x: cx - px, y: cy - py });
      pts.push({ x: cx - py, y: cy - px });
      pts.push({ x: cx - py, y: cy + px });
      pts.push({ x: cx - px, y: cy + py });
    }

    while (x <= y) {
      add8(x, y);
      if (d < 0) {
        d += 4 * x + 6;
      } else {
        d += 4 * (x - y) + 10;
        y--;
      }
      x++;
    }
    return uniquePoints(pts);
  }

  function buildPoints(algo, p) {
    switch (algo) {
      case 'step': return stepLine(p.x1, p.y1, p.x2, p.y2);
      case 'dda': return ddaLine(p.x1, p.y1, p.x2, p.y2);
      case 'bresLine': return bresenhamLine(p.x1, p.y1, p.x2, p.y2);
      case 'bresCircle': return bresenhamCircle(p.x1, p.y1, p.r);
      default: return [];
    }
  }

  function algoName(algo) {
    return {
      step: 'Пошаговый алгоритм',
      dda: 'ЦДА (DDA)',
      bresLine: 'Брезенхем — отрезок',
      bresCircle: 'Брезенхем — окружность'
    }[algo] || algo;
  }

  function showInfo(p, points) {
    const n = points.length;
    let text = '<b>' + algoName(p.algo) + '</b><br>';
    if (p.algo === 'bresCircle') {
      text += 'Центр: (' + p.x1 + '; ' + p.y1 + '), радиус: ' + p.r + '<br>';
    } else {
      text += 'Отрезок: (' + p.x1 + '; ' + p.y1 + ') → (' + p.x2 + '; ' + p.y2 + ')<br>';
    }
    text += 'Количество растровых точек: ' + n + '<br>';
    text += 'Масштаб: ' + state.scale + ' px/ед.; начало координат — в центре холста; ось Y направлена вверх.';
    els.info.innerHTML = text;
  }

  function renderSteps(points) {
    const maxRows = 60;
    let html = '<table><thead><tr><th>№</th><th>x</th><th>y</th></tr></thead><tbody>';
    const n = Math.min(points.length, maxRows);
    for (let i = 0; i < n; i++) {
      html += '<tr data-index="' + i + '"><td>' + (i + 1) + '</td><td>' + points[i].x + '</td><td>' + points[i].y + '</td></tr>';
    }
    html += '</tbody></table>';
    if (points.length > maxRows) {
      html += '<p class="hint">Показаны первые ' + maxRows + ' точек из ' + points.length + '.</p>';
    }
    els.stepsWrap.innerHTML = html;
  }

  function highlightStep(index) {
    const rows = els.stepsWrap.querySelectorAll('tbody tr');
    rows.forEach(function(row) {
      row.classList.toggle('current', parseInt(row.getAttribute('data-index'), 10) === index);
    });
  }

  function stopAnimation() {
    if (state.timer) {
      clearTimeout(state.timer);
      state.timer = null;
    }
    state.animIndex = -1;
  }

  function draw() {
    stopAnimation();
    const p = readParams();
    state.lastParams = p;
    const points = buildPoints(p.algo, p);
    state.points = points;
    render(points);
    showInfo(p, points);
    renderSteps(points);
  }

  function animate() {
    stopAnimation();
    const p = readParams();
    state.lastParams = p;
    const points = buildPoints(p.algo, p);
    state.points = points;
    showInfo(p, points);
    renderSteps(points);
    if (!points.length) return;

    let i = 0;
    function tick() {
      render(points, i, i);
      highlightStep(i);
      i++;
      if (i < points.length) {
        state.timer = setTimeout(tick, 80);
      } else {
        state.timer = null;
        state.animIndex = -1;
        render(points);
        highlightStep(-1);
      }
    }
    tick();
  }

  function measureOne(algo, p, repeats) {
    let sink = 0;
    const t0 = performance.now();
    for (let i = 0; i < repeats; i++) {
      sink += buildPoints(algo, p).length;
    }
    const t1 = performance.now();
    return {
      avg: (t1 - t0) / repeats,
      total: t1 - t0,
      repeats: repeats,
      sink: sink
    };
  }

  function timing() {
    stopAnimation();
    const p = readParams();
    const algos = ['step', 'dda', 'bresLine', 'bresCircle'];
    const rows = [];
    for (let i = 0; i < algos.length; i++) {
      const algo = algos[i];
      const repeats = algo === 'bresCircle' ? 5000 : 20000;
      const res = measureOne(algo, p, repeats);
      rows.push({
        name: algoName(algo),
        repeats: res.repeats,
        avg: res.avg,
        total: res.total
      });
    }
    let html = '<b>Замер времени</b><br>';
    html += '<p class="hint">Для отрезков используются x1,y1–x2,y2; для окружности — центр x1,y1 и радиус. ' +
            'Время зависит от браузера, CPU и загрузки системы.</p>';
    html += '<table><thead><tr><th>Алгоритм</th><th>Повторов</th><th>Среднее, мс</th><th>Всего, мс</th></tr></thead><tbody>';
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      html += '<tr><td style="text-align:left">' + r.name + '</td><td>' + r.repeats +
              '</td><td>' + r.avg.toFixed(6) + '</td><td>' + r.total.toFixed(3) + '</td></tr>';
    }
    html += '</tbody></table>';
    els.info.innerHTML = html;
    if (state.points && state.points.length) {
      render(state.points);
    } else {
      drawGrid();
    }
  }

  function clearAll() {
    stopAnimation();
    state.points = [];
    drawGrid();
    els.info.textContent = 'Очищено. Выберите алгоритм и нажмите «Построить».';
    els.stepsWrap.innerHTML = '';
  }

  document.getElementById('btnDraw').addEventListener('click', draw);
  document.getElementById('btnAnimate').addEventListener('click', animate);
  document.getElementById('btnTiming').addEventListener('click', timing);
  document.getElementById('btnClear').addEventListener('click', clearAll);

  els.scale.addEventListener('input', function() {
    readParams();
    if (state.points && state.points.length) render(state.points);
    else drawGrid();
  });

  els.showGrid.addEventListener('change', function() {
    readParams();
    if (state.points && state.points.length) render(state.points);
    else drawGrid();
  });

  readParams();
  drawGrid();
})();
</script>
</body>
</html>
